            padding: 10px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"] {
            flex: 2;
            min-width: 250px;
        }

        select {
            flex: 1;
            min-width: 180px;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .btn-print {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-print:hover {
            background-color: #1d4ed8;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 10px;
            text-align: right;
            white-space: nowrap;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
            white-space: nowrap;
        }

        tr:nth-child(even) {
            background-color: #f8fafc;
        }

        tr:hover {
            background-color: #f1f5f9;
        }

        .badge-code {
            background-color: #e0f2fe;
            color: #0369a1;
            padding: 3px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: bold;
        }

        .badge-id {
            font-family: monospace;
            letter-spacing: 0.5px;
            color: #334155;
        }

        .stats-count {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #64748b;
            text-align: left;
        }

            .controls, .stats-count { display: none; }
            body { padding: 0; background: white; }

        // تهيئة قائمة التخصصات في الفلتر تلقائياً
        function initSubjectFilter() {
            const subjectSelect = document.getElementById('subjectFilter');
            const subjects = [...new Set(staffData.map(item => item.subject).filter(s => s && s !== "-"))];
            
            subjects.sort().forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub;
                opt.textContent = sub;
                subjectSelect.appendChild(opt);
            });
        }

        // رسم الجدول بناءً على البيانات المصفاة
        function renderTable(data) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            data.forEach(item => {
                const row = `
                    <tr>
                        <td>${item.id}</td>
                        <td><strong>${item.name}</strong></td>
                        <td><span class="badge-code">${item.code}</span></td>
                        <td><span class="badge-id">${item.nationalId}</span></td>
                        <td>${item.jobTitle}</td>
                        <td>${item.subject || '-'}</td>
                        <td>${item.qualification}</td>
                        <td>${item.appointmentDate}</td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });

            document.getElementById('recordCount').textContent = `إجمالي السجلات المعروضة: ${data.length} من أصل ${staffData.length}`;
        }

        // دالة الفلترة والبحث اللحظي
        function filterData() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const selectedSubject = document.getElementById('subjectFilter').value;

            const filtered = staffData.filter(item => {
                const matchesQuery = 
                    item.name.toLowerCase().includes(query) ||
                    item.code.includes(query) ||
                    item.nationalId.includes(query) ||
                    item.jobTitle.toLowerCase().includes(query) ||
                    (item.subject && item.subject.toLowerCase().includes(query)) ||
                    item.qualification.toLowerCase().includes(query);

                const matchesSubject = selectedSubject === "" || item.subject === selectedSubject;

                return matchesQuery && matchesSubject;
            });

            renderTable(filtered);
        }

        // تشغيل التهيئة عند تحميل الصفحة
        window.onload = () => {
            initSubjectFilter();
            renderTable(staffData);
        };
