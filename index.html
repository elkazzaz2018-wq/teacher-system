<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة بيانات المعلمين - معمل القزاز</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .navbar { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-radius: 15px; padding: 15px 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .navbar-brand { font-size: 1.5rem; font-weight: bold; color: #667eea; }
        .navbar-nav { display: flex; gap: 15px; list-style: none; margin-top: 10px; flex-wrap: wrap; }
        .nav-link { color: #333; text-decoration: none; padding: 8px 15px; border-radius: 8px; transition: all 0.3s; cursor: pointer; }
        .nav-link:hover, .nav-link.active { background: #667eea; color: white; }
        .card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .stat-card { text-align: center; color: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .stat-card h2 { font-size: 3rem; margin: 10px 0; }
        .stat-card.blue { background: linear-gradient(135deg, #667eea, #764ba2); }
        .stat-card.green { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .stat-card.orange { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .stat-card.purple { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .table-container { overflow-x: auto; max-height: 600px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; background: white; }
        table th { background: #667eea; color: white; padding: 12px; text-align: right; position: sticky; top: 0; }
        table td { padding: 10px; border-bottom: 1px solid #eee; text-align: right; }
        table tr:hover { background: #f5f5f5; }
        .btn { display: inline-block; padding: 8px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.3s; margin: 2px; }
        .btn-primary { background: #667eea; color: white; }
        .btn-success { background: #11998e; color: white; }
        .btn-danger { background: #f5576c; color: white; }
        .btn-warning { background: #f093fb; color: white; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal-content { background: white; border-radius: 15px; max-width: 600px; margin: 50px auto; padding: 20px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .search-box input, .search-box select { padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .search-box input { flex: 1; min-width: 200px; }
        .alert { padding: 15px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .section { display: none; }
        .section.active { display: block; }
        @media (max-width: 768px) { .row { grid-template-columns: 1fr; } .navbar-nav { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="navbar-brand">📊 نظام إدارة بيانات المعلمين</div>
            <ul class="navbar-nav">
                <li><a class="nav-link active" onclick="showSection('dashboard')">الرئيسية</a></li>
                <li><a class="nav-link" onclick="showSection('employees')">الموظفون</a></li>
                <li><a class="nav-link" onclick="showSection('statistics')">الإحصائيات</a></li>
            </ul>
        </nav>

        <div id="alert" class="alert"></div>

        <div id="dashboard" class="section active">
            <h2 class="text-center mb-4">لوحة التحكم الرئيسية</h2>
            <div class="row">
                <div class="stat-card blue"><h3>إجمالي الموظفين</h3><h2 id="totalEmployees">0</h2></div>
                <div class="stat-card green"><h3>ذكور</h3><h2 id="maleEmployees">0</h2></div>
                <div class="stat-card orange"><h3>إناث</h3><h2 id="femaleEmployees">0</h2></div>
                <div class="stat-card purple"><h3>مشمولون بالكادر</h3><h2 id="coveredEmployees">0</h2></div>
            </div>
        </div>

        <div id="employees" class="section">
            <h2 class="mb-4">قائمة الموظفين</h2>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 بحث..." oninput="filterEmployees()">
                <button class="btn btn-success" onclick="showAddModal()">➕ إضافة</button>
            </div>
            <div class="table-container">
                <table>
                    <thead><tr><th>م</th><th>الاسم</th><th>الوظيفة</th><th>المادة</th><th>الحالة</th><th>إجراءات</th></tr></thead>
                    <tbody id="employeesTable"></tbody>
                </table>
            </div>
        </div>

        <div id="statistics" class="section">
            <h2 class="mb-4">الإحصائيات</h2>
            <div class="card"><h3>ملخص</h3><div id="summaryStats"></div></div>
        </div>
    </div>

    <div id="employeeModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">إضافة موظف</h3>
            <form id="employeeForm">
                <input type="hidden" id="empId">
                <div class="form-group"><label>الاسم</label><input type="text" id="fullName" required></div>
                <div class="form-group"><label>الوظيفة</label><select id="jobTitle"><option value="معلم">معلم</option><option value="معلم أول">معلم أول</option><option value="معلم أول أ">معلم أول أ</option><option value="معلم خبير">معلم خبير</option><option value="كبير معلمين">كبير معلمين</option></select></div>
                <div class="form-group"><label>المادة</label><input type="text" id="subject"></div>
                <div class="form-group"><input type="checkbox" id="covered"><label for="covered">مشمول</label></div>
                <div class="form-group"><button type="submit" class="btn btn-primary">حفظ</button></div>
            </form>
        </div>
    </div>

    <script>
        const employees = [
            {id:1, name:"إبراهيم عبد الرازق", job:"معلم بالحصة", subject:"كيمياء", covered:false},
            {id:2, name:"أحمد أيوب محمود", job:"معلم أول أ", subject:"فلسفة ومنطق", covered:true},
            {id:3, name:"أحمد شحاتة محمود", job:"معلم أول", subject:"فيزياء", covered:true},
            {id:4, name:"أحمد عبدالستار", job:"معلم بالحصة", subject:"لغة عربية ودين", covered:false},
            {id:5, name:"أحمد متولى محمد", job:"معلم خبير", subject:"لغة عربية ودين", covered:true},
            {id:6, name:"أحمد محمد محمد", job:"معلم أول", subject:"فلسفة ومنطق", covered:true},
            {id:7, name:"اسامه ابراهيم", job:"معلم خبير", subject:"لغة فرنسية", covered:true},
            {id:8, name:"اسامه النوبى", job:"معلم أول", subject:"لغة إنجليزية", covered:true}
        ];

        function showSection(section) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(section).classList.add('active');
            if (section === 'dashboard') updateDashboard();
            if (section === 'employees') updateTable();
            if (section === 'statistics') updateStats();
        }

        function updateDashboard() {
            document.getElementById('totalEmployees').textContent = employees.length;
            document.getElementById('maleEmployees').textContent = employees.filter(e => !e.name.includes('ة')).length;
            document.getElementById('femaleEmployees').textContent = employees.filter(e => e.name.includes('ة')).length;
            document.getElementById('coveredEmployees').textContent = employees.filter(e => e.covered).length;
        }

        function updateTable() {
            let html = '';
            employees.forEach((emp, i) => {
                html += `<tr><td>${i+1}</td><td>${emp.name}</td><td>${emp.job}</td><td>${emp.subject}</td><td>${emp.covered ? 'مشمول' : 'غير مشمول'}</td><td><button onclick="deleteEmployee(${emp.id})">حذف</button></td></tr>`;
            });
            document.getElementById('employeesTable').innerHTML = html;
        }

        function filterEmployees() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = employees.filter(e => e.name.toLowerCase().includes(term));
            let html = '';
            filtered.forEach((emp, i) => {
                html += `<tr><td>${i+1}</td><td>${emp.name}</td><td>${emp.job}</td><td>${emp.subject}</td></tr>`;
            });
            document.getElementById('employeesTable').innerHTML = html;
        }

        function updateStats() {
            document.getElementById('summaryStats').innerHTML = `<p>إجمالي: ${employees.length}</p><p>ذكور: ${employees.filter(e => !e.name.includes('ة')).length}</p><p>إناث: ${employees.filter(e => e.name.includes('ة')).length}</p>`;
        }

        function deleteEmployee(id) {
            if (confirm('حذف؟')) {
                const index = employees.findIndex(e => e.id === id);
                if (index > -1) employees.splice(index, 1);
                updateTable();
                updateDashboard();
            }
        }

        window.onload = function() { updateDashboard(); updateTable(); };
    </script>
</body>
</html>
