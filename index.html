<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة بيانات هيئة التدريس والعاملين</title>
    <!-- مكتبة التصدير إلى إكسيل -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #0284c7;
            --success-color: #16a34a;
            --danger-color: #dc2626;
            --warning-color: #d97706;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 1250px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1 { color: var(--primary-color); text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #64748b; margin-top: 0; margin-bottom: 20px; }

        /* شريط الإحصائيات */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #f1f5f9;
            border-right: 4px solid var(--primary-color);
            padding: 15px;
            border-radius: 8px;
        }

        .stat-card h3 { margin: 0; font-size: 0.85rem; color: #475569; }
        .stat-card .value { font-size: 1.5rem; font-weight: bold; color: var(--primary-color); margin-top: 5px; }

        /* التحكم والبحث */
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        input[type="text"], select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; }
        input[type="text"] { flex: 2; min-width: 200px; }
        select { flex: 1; min-width: 150px; }

        .btn { padding: 9px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-excel { background-color: var(--success-color); color: white; }
        .btn-add { background-color: var(--secondary-color); color: white; }
        .btn-print { background-color: var(--primary-color); color: white; }
        .btn-edit { background-color: var(--warning-color); color: white; padding: 5px 10px; font-size: 0.8rem; }
        .btn-delete { background-color: var(--danger-color); color: white; padding: 5px 10px; font-size: 0.8rem; }

        /* الجدول */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.88rem; }
        th { background-color: var(--primary-color); color: white; padding: 12px; text-align: right; }
        td { padding: 10px; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
        tr:nth-child(even) { background-color: #f8fafc; }

        /* النوافذ المنبثقة */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 10px; width: 450px; max-width: 90%; }
        .modal-content h3 { margin-top: 0; color: var(--primary-color); }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 5px; }
        .form-group input { width: 100%; box-sizing: border-box; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

        @media print {
            .controls, .stats-grid, .btn-action, .modal { display: none !important; }
            body { padding: 0; background: white; }
            .container { box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مدرسة معمل القزاز الثانوية المشتركة</h1>
        <p class="subtitle">نظام إدارة السجلات والإحصائيات المحمي</p>

        <!-- لوحة الإحصائيات -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>إجمالي العاملين</h3>
                <div class="value" id="statTotal">0</div>
            </div>
            <div class="stat-card">
                <h3>معلمون على الكادر</h3>
                <div class="value" id="statCadre">0</div>
            </div>
            <div class="stat-card">
                <h3>معلمون بالحصة</h3>
                <div class="value" id="statHessa">0</div>
            </div>
            <div class="stat-card">
                <h3>الوظائف المعاونة والإدارية</h3>
                <div class="value" id="statAdmin">0</div>
            </div>
        </div>

        <!-- أدوات التحكم والبحث -->
        <div class="controls">
            <input type="text" id="searchInput" onkeyup="filterData()" placeholder="ابحث باسم المعلم، الكود، الرقم القومي، أو التخصص...">
            <select id="subjectFilter" onchange="filterData()">
                <option value="">جميع التخصصات / المواد</option>
            </select>
            <button class="btn btn-add" onclick="openAddModal()">+ إضافة موظف</button>
            <button class="btn btn-excel" onclick="exportToExcel()">تصدير إكسيل 📊</button>
            <button class="btn btn-print" onclick="window.print()">طباعة السجل</button>
        </div>

        <!-- جدول العرض -->
        <div class="table-responsive">
            <table id="staffTable">
                <thead>
                    <tr>
                        <th>م</th>
                        <th>الاسم الكامل</th>
                        <th>كود المعلم</th>
                        <th>الرقم القومي</th>
                        <th>الوظيفة / الصفة</th>
                        <th>المادة / التخصص</th>
                        <th>المؤهل الدراسي</th>
                        <th class="btn-action">الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- نافذة إضافة / تعديل البيانات -->
    <div class="modal" id="dataModal">
        <div class="modal-content">
            <h3 id="modalTitle">بيانات الموظف</h3>
            <input type="hidden" id="editId">
            <div class="form-group">
                <label>الاسم الكامل</label>
                <input type="text" id="editName">
            </div>
            <div class="form-group">
                <label>الكود</label>
                <input type="text" id="editCode">
            </div>
            <div class="form-group">
                <label>الرقم القومي</label>
                <input type="text" id="editNationalId">
            </div>
            <div class="form-group">
                <label>الوظيفة</label>
                <input type="text" id="editJobTitle">
            </div>
            <div class="form-group">
                <label>التخصص / المادة</label>
                <input type="text" id="editSubject">
            </div>
            <div class="form-group">
                <label>المؤهل الدراسي</label>
                <input type="text" id="editQualification">
            </div>
            <div class="modal-actions">
                <button class="btn" onclick="closeModal()">إلغاء</button>
                <button class="btn btn-print" onclick="saveData()">حفظ</button>
            </div>
        </div>
    </div>

    <script>
        // كلمة السر المحددة للعمليات الإدارية
        const ADMIN_PASSWORD = "2608";

        // البيانات الأساسية
        let staffData = [
          { id: 1, code: "3470613", nationalId: "30009281800215", name: "ابراهيم عبد الرازق عبد الونيس منبي خليف", subject: "كيمياء", jobTitle: "معلم بالحصه", qualification: "بكالوريوس علوم وتربية" },
          { id: 2, code: "478529", nationalId: "27905281801419", name: "احمد ايوب محمود الحناوي", subject: "الفلسفة والمنطق", jobTitle: "معلم أول أ", qualification: "ليسانس اداب وحاصل على دبلومة تربوية" },
          { id: 3, code: "2489162", nationalId: "28310201803351", name: "أحمد شحاته محمود يوسف", subject: "فيزياء", jobTitle: "معلم أول", qualification: "بكالوريوس علوم وتربية" },
          { id: 4, code: "2480188", nationalId: "28410021802475", name: "محمد عبد الوهاب عبد الجليل القزاز", subject: "تربية نفسية", jobTitle: "أخصائي نفسي", qualification: "بكالوريوس علوم وتربية" }
        ];

        // دالة التحقق من كلمة السر
        function verifyPassword() {
            const pwd = prompt("يرجى إدخال كلمة السر للمتابعة:");
            if (pwd === ADMIN_PASSWORD) {
                return true;
            } else if (pwd !== null) {
                alert("كلمة السر غير صحيحة!");
            }
            return false;
        }

        // تحديث كروت الإحصائيات
        function updateStats() {
            document.getElementById('statTotal').textContent = staffData.length;
            const cadreCount = staffData.filter(item => item.jobTitle.includes('معلم') && !item.jobTitle.includes('بالحصه')).length;
            const hessaCount = staffData.filter(item => item.jobTitle.includes('بالحصه')).length;
            const adminCount = staffData.length - (cadreCount + hessaCount);

            document.getElementById('statCadre').textContent = cadreCount;
            document.getElementById('statHessa').textContent = hessaCount;
            document.getElementById('statAdmin').textContent = adminCount;
        }

        // تهيئة قائمة المواد
        function initSubjectFilter() {
            const subjectSelect = document.getElementById('subjectFilter');
            subjectSelect.innerHTML = '<option value="">جميع التخصصات / المواد</option>';
            const subjects = [...new Set(staffData.map(item => item.subject).filter(s => s && s !== "-"))];
            
            subjects.sort().forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub;
                opt.textContent = sub;
                subjectSelect.appendChild(opt);
            });
        }

        // عرض الجدول
        function renderTable(data) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            data.forEach((item, index) => {
                const row = `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${item.name}</strong></td>
                        <td>${item.code}</td>
                        <td>${item.nationalId}</td>
                        <td>${item.jobTitle}</td>
                        <td>${item.subject || '-'}</td>
                        <td>${item.qualification}</td>
                        <td class="btn-action">
                            <button class="btn btn-edit" onclick="openEditModal(${item.id})">تعديل</button>
                            <button class="btn btn-delete" onclick="deleteRecord(${item.id})">حذف</button>
                        </td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
            updateStats();
        }

        // البحث والفلترة
        function filterData() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const selectedSubject = document.getElementById('subjectFilter').value;

            const filtered = staffData.filter(item => {
                const matchesQuery = 
                    item.name.toLowerCase().includes(query) ||
                    item.code.includes(query) ||
                    item.nationalId.includes(query) ||
                    item.jobTitle.toLowerCase().includes(query) ||
                    (item.subject && item.subject.toLowerCase().includes(query));

                const matchesSubject = selectedSubject === "" || item.subject === selectedSubject;
                return matchesQuery && matchesSubject;
            });

            renderTable(filtered);
        }

        // فتح نافذة الإضافة
        function openAddModal() {
            if (!verifyPassword()) return;
            document.getElementById('modalTitle').textContent = "إضافة موظف جديد";
            document.getElementById('editId').value = "";
            document.getElementById('editName').value = "";
            document.getElementById('editCode').value = "";
            document.getElementById('editNationalId').value = "";
            document.getElementById('editJobTitle').value = "";
            document.getElementById('editSubject').value = "";
            document.getElementById('editQualification').value = "";
            document.getElementById('dataModal').style.display = 'flex';
        }

        // فتح نافذة التعديل
        function openEditModal(id) {
            if (!verifyPassword()) return;
            const item = staffData.find(record => record.id === id);
            if (!item) return;

            document.getElementById('modalTitle').textContent = "تعديل بيانات الموظف";
            document.getElementById('editId').value = item.id;
            document.getElementById('editName').value = item.name;
            document.getElementById('editCode').value = item.code;
            document.getElementById('editNationalId').value = item.nationalId;
            document.getElementById('editJobTitle').value = item.jobTitle;
            document.getElementById('editSubject').value = item.subject;
            document.getElementById('editQualification').value = item.qualification;

            document.getElementById('dataModal').style.display = 'flex';
        }

        // إغلاق النافذة
        function closeModal() {
            document.getElementById('dataModal').style.display = 'none';
        }

        // حفظ البيانات (إضافة أو تعديل)
        function saveData() {
            const idVal = document.getElementById('editId').value;
            
            if (idVal === "") {
                // إضافة جديد
                const newRecord = {
                    id: Date.now(),
                    name: document.getElementById('editName').value,
                    code: document.getElementById('editCode').value,
                    nationalId: document.getElementById('editNationalId').value,
                    jobTitle: document.getElementById('editJobTitle').value,
                    subject: document.getElementById('editSubject').value,
                    qualification: document.getElementById('editQualification').value
                };
                staffData.push(newRecord);
            } else {
                // تعديل حالي
                const id = parseInt(idVal);
                const item = staffData.find(record => record.id === id);
                if (item) {
                    item.name = document.getElementById('editName').value;
                    item.code = document.getElementById('editCode').value;
                    item.nationalId = document.getElementById('editNationalId').value;
                    item.jobTitle = document.getElementById('editJobTitle').value;
                    item.subject = document.getElementById('editSubject').value;
                    item.qualification = document.getElementById('editQualification').value;
                }
            }

            closeModal();
            initSubjectFilter();
            filterData();
        }

        // حذف سجل
        function deleteRecord(id) {
            if (!verifyPassword()) return;
            if (confirm("هل أنت تأكد من رغبتك في حذف هذا السجل؟")) {
                staffData = staffData.filter(item => item.id !== id);
                initSubjectFilter();
                filterData();
            }
        }

        // تصدير إلى Excel
        function exportToExcel() {
            // إعداد البيانات للتصدير (بدون عمود أزرار الإجراءات)
            const exportData = staffData.map((item, index) => ({
                "م": index + 1,
                "الاسم الكامل": item.name,
                "كود المعلم": item.code,
                "الرقم القومي": item.nationalId,
                "الوظيفة": item.jobTitle,
                "المادة / التخصص": item.subject || '-',
                "المؤهل الدراسي": item.qualification
            }));

            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "بيانات العاملين");
            
            // تنزيل الملف
            XLSX.writeFile(workbook, "سجل_بيانات_العاملين.xlsx");
        }

        window.onload = () => {
            initSubjectFilter();
            renderTable(staffData);
        };
    </script>
</body>
</html>
